# DZG Search Terms for PubMed Affiliation Search
# Structure: DZG -> Network/Location -> List of Search Terms
# 'general' = parent search for the entire DZG
#
# active_dzg: set to the DZG key you want to extract, prepare and display.
# Only this DZG's data will be downloaded, processed and shown in the dashboard.

active_dzg: DZL

# Colours used across the dashboard.
# dzg   : one colour per DZG, used for the co-affiliation chart.
# sites : one colour per site, grouped by the DZG the site belongs to.
# Any DZG or site left out here falls back to a built-in palette, assigned in
# alphabetical order so the same name always keeps the same colour.
colors:
  dzg:
    DZL:  "#5dade2"   # light blue
    DZIF: "#3ecfaa"   # turquoise
    DZNE: "#f5a623"   # orange
    DZPG: "#9b7cf5"   # purple
    DZKJ: "#2c5aa0"   # dark blue
    DZHK: "#e8534f"   # red
    DKTK: "#8fcc3a"   # green
    DZD:  "#f0c040"   # yellow
  sites:
    DZL:
      BREATH: "#f5a623"   # orange
      ARCN:   "#8fcc3a"   # green
      UGMLC:  "#9b7cf5"   # purple
      TLRC:   "#4f8ef7"   # blue
      CPC-M:  "#3ecfaa"   # turquoise
    DZHK:
      NORTH:                "#f5a623"   # orange
      MUNICH:               "#8fcc3a"   # green
      LOWER SAXONY:         "#9b7cf5"   # purple
      RHINE-MAIN:           "#4f8ef7"   # blue
      BERLIN:               "#3ecfaa"   # turquoise
      HEIDELBERG/MANNHEIM:  "#f0c040"   # yellow




